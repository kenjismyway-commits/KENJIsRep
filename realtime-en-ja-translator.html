<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>翻訳 — Live EN→JA</title>
<style>
  :root{
    --ink:#141b2e;
    --panel:#1c2540;
    --panel-2:#232d4f;
    --line:#33436b;
    --washi:#f4efe2;
    --shu:#c13b2e;
    --shu-dim:#8c2c22;
    --mist:#8fa0c4;
    --mist-dim:#5c6c93;
    --gold:#caa15a;
    --danger:#e0554a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--washi);
    font-family:-apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    display:flex;
    flex-direction:column;
    min-height:100vh;
    min-height:100dvh;
    overflow:hidden;
  }

  /* ---------- header ---------- */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:calc(env(safe-area-inset-top) + 14px) 18px 12px;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .brand{display:flex; align-items:baseline; gap:8px;}
  .brand .kanji{font-size:20px; font-weight:700; letter-spacing:.08em;}
  .brand .sub{font-size:11px; color:var(--mist); letter-spacing:.14em; text-transform:uppercase; font-family:ui-monospace,"SF Mono",Menlo,monospace;}
  .status{display:flex; align-items:center; gap:7px; font-size:12px; color:var(--mist); font-family:ui-monospace,"SF Mono",Menlo,monospace;}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--mist-dim); transition:background .2s, box-shadow .2s;}
  .dot.live{background:var(--shu); box-shadow:0 0 0 0 rgba(193,59,46,.6); animation:pulse 1.5s infinite;}
  .dot.busy{background:var(--gold);}
  .dot.err{background:var(--danger);}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(193,59,46,.55);}
    70%{box-shadow:0 0 0 8px rgba(193,59,46,0);}
    100%{box-shadow:0 0 0 0 rgba(193,59,46,0);}
  }
  .gear{
    background:none; border:none; color:var(--mist); font-size:20px;
    width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center;
  }
  .gear:active{background:var(--panel-2);}

  /* ---------- transcript log ---------- */
  main{
    flex:1;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:18px 16px 8px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .empty{
    margin:auto;
    text-align:center;
    color:var(--mist-dim);
    padding:0 30px;
    line-height:1.8;
  }
  .empty .stamp{font-size:34px; margin-bottom:10px;}
  .entry{animation:rise .25s ease;}
  @keyframes rise{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
  .entry .en{
    font-family:ui-monospace,"SF Mono",Menlo,monospace;
    font-size:12.5px;
    color:var(--mist);
    line-height:1.5;
    margin-bottom:6px;
    word-break:break-word;
  }
  .entry .ja{
    background:var(--panel);
    border-left:3px solid var(--shu);
    border-radius:4px;
    padding:12px 14px;
    font-size:20px;
    line-height:1.65;
    letter-spacing:.01em;
    word-break:break-word;
  }
  .entry .ja.pending{color:var(--mist); font-size:15px; font-style:italic;}
  .entry .ja.failed{border-left-color:var(--danger); color:var(--danger); font-size:14px;}

  /* ---------- footer / caption + mic ---------- */
  footer{
    flex-shrink:0;
    padding:10px 18px calc(env(safe-area-inset-bottom) + 22px);
    border-top:1px solid var(--line);
    background:linear-gradient(var(--ink), #10162650);
  }
  .caption{
    min-height:20px;
    text-align:center;
    font-family:ui-monospace,"SF Mono",Menlo,monospace;
    font-size:13px;
    color:var(--mist-dim);
    font-style:italic;
    margin-bottom:14px;
    padding:0 10px;
    word-break:break-word;
  }
  .caption.on{color:var(--mist);}
  .controls{display:flex; align-items:center; justify-content:center; gap:22px;}
  .clear-btn{
    background:none; border:none; color:var(--mist-dim);
    font-size:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace;
    letter-spacing:.05em; padding:8px;
  }
  .mic{
    width:78px; height:78px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #d4493a, var(--shu) 60%, var(--shu-dim) 100%);
    border:3px solid #e7c9a1;
    box-shadow:0 4px 18px rgba(0,0,0,.4), inset 0 0 0 2px rgba(0,0,0,.15);
    display:flex; align-items:center; justify-content:center;
    color:var(--washi); font-size:11px; font-weight:700; letter-spacing:.1em;
    transition:transform .12s ease;
    position:relative;
  }
  .mic:active{transform:scale(.94);}
  .mic.listening{
    background:radial-gradient(circle at 35% 30%, #e2544a, var(--shu) 55%, var(--shu-dim) 100%);
  }
  .mic.listening::before{
    content:"";
    position:absolute; inset:-10px;
    border-radius:50%;
    border:2px solid var(--shu);
    animation:ring 1.6s infinite;
  }
  @keyframes ring{
    0%{transform:scale(.85); opacity:.7;}
    100%{transform:scale(1.35); opacity:0;}
  }
  .mic .label{pointer-events:none;}
  .hint{width:52px;}

  /* ---------- settings sheet ---------- */
  .sheet-backdrop{
    position:fixed; inset:0; background:rgba(10,13,24,.6);
    display:none; align-items:flex-end; z-index:20;
  }
  .sheet-backdrop.open{display:flex;}
  .sheet{
    width:100%; background:var(--panel); border-radius:18px 18px 0 0;
    padding:22px 20px calc(env(safe-area-inset-bottom) + 24px);
    max-height:85vh; overflow-y:auto;
  }
  .sheet h2{margin:0 0 4px; font-size:17px;}
  .sheet .desc{color:var(--mist); font-size:12.5px; line-height:1.6; margin:0 0 18px;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12px; color:var(--mist); margin-bottom:6px; letter-spacing:.04em;}
  .field input[type=password], .field input[type=text]{
    width:100%; padding:12px 13px; border-radius:9px; border:1px solid var(--line);
    background:var(--ink); color:var(--washi); font-size:15px; font-family:ui-monospace,"SF Mono",Menlo,monospace;
  }
  .seg{display:flex; gap:8px;}
  .seg button{
    flex:1; padding:11px 6px; border-radius:9px; border:1px solid var(--line);
    background:var(--ink); color:var(--mist); font-size:13px;
  }
  .seg button.active{border-color:var(--shu); color:var(--washi); background:var(--panel-2);}
  .save-btn{
    width:100%; padding:14px; border:none; border-radius:10px;
    background:var(--shu); color:var(--washi); font-size:15px; font-weight:700; margin-top:6px;
  }
  .save-btn:active{background:var(--shu-dim);}
  .close-btn{
    width:100%; padding:12px; border:none; background:none; color:var(--mist-dim); font-size:13px; margin-top:8px;
  }
  .note{font-size:11.5px; color:var(--mist-dim); line-height:1.6; margin-top:16px; padding-top:14px; border-top:1px solid var(--line);}
  .note a{color:var(--mist);}

  .fatal{
    margin:auto; padding:30px; text-align:center; color:var(--washi); line-height:1.8;
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="kanji">翻訳</span>
    <span class="sub">Live EN → JA</span>
  </div>
  <div class="status">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">準備中</span>
    <button class="gear" id="gearBtn" aria-label="設定">⚙</button>
  </div>
</header>

<main id="log">
  <div class="empty" id="emptyState">
    <div class="stamp">翻訳</div>
    英語で話しかけると、ここに日本語訳が表示されます。<br>
    下のマイクボタンをタップして開始してください。
  </div>
</main>

<footer>
  <div class="caption" id="caption"></div>
  <div class="controls">
    <div class="hint"></div>
    <button class="mic" id="micBtn">
      <span class="label" id="micLabel">開始</span>
    </button>
    <button class="clear-btn hint" id="clearBtn">クリア</button>
  </div>
</footer>

<div class="sheet-backdrop" id="sheetBackdrop">
  <div class="sheet">
    <h2>このアプリについて</h2>
    <p class="desc">APIキーは不要です。翻訳にはGoogle翻訳の無料エンドポイントを使用しています。</p>
    <p class="note" style="margin-top:0; padding-top:0; border-top:none;">
      ・精度はClaudeやDeepLほど高くない場合があります(短い口語文向け)<br>
      ・Google側の仕様変更により、予告なく動かなくなる可能性があります<br>
      ・音声認識(英語)・翻訳(日本語)ともにインターネット接続が必要です<br>
      ・ホーム画面に追加(PWA化)すると音声認識が動かなくなるため、Safariのタブで直接開いた状態でご利用ください
    </p>
    <button class="close-btn" id="closeBtn">閉じる</button>
  </div>
</div>

<script>
(function(){
  const $ = (id) => document.getElementById(id);
  const log = $('log'), emptyState = $('emptyState'), caption = $('caption');
  const micBtn = $('micBtn'), micLabel = $('micLabel'), clearBtn = $('clearBtn');
  const statusDot = $('statusDot'), statusText = $('statusText');
  const gearBtn = $('gearBtn'), sheetBackdrop = $('sheetBackdrop');
  const closeBtn = $('closeBtn');

  // ---------- feature detection ----------
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    document.body.innerHTML = '<div class="fatal">この端末・ブラウザは音声認識に対応していません。<br><br>iPhoneの「設定アプリ」からではなく、<b>Safariでこのファイルを直接開いて</b>ください。ホーム画面に追加した状態(PWA)では音声認識が動作しません。</div>';
    return;
  }

  // ---------- state ----------
  let userWantsListening = false;
  let recognitionActive = false;
  let restartTimer = null;
  let translateQueue = [];
  let queueRunning = false;
  let consecutiveErrors = 0;

  function openSheet(){ sheetBackdrop.classList.add('open'); }
  function closeSheet(){ sheetBackdrop.classList.remove('open'); }
  gearBtn.addEventListener('click', openSheet);
  closeBtn.addEventListener('click', closeSheet);
  sheetBackdrop.addEventListener('click', (e) => { if (e.target === sheetBackdrop) closeSheet(); });

  // ---------- status ----------
  function setStatus(state){
    statusDot.className = 'dot';
    if (state === 'listening'){ statusDot.classList.add('live'); statusText.textContent = '聞いています…'; }
    else if (state === 'busy'){ statusDot.classList.add('busy'); statusText.textContent = '翻訳中…'; }
    else if (state === 'error'){ statusDot.classList.add('err'); statusText.textContent = 'エラー'; }
    else { statusText.textContent = '待機中'; }
  }
  setStatus('idle');

  // ---------- transcript log ----------
  function addEntry(enText){
    const es = document.getElementById('emptyState');
    if (es) es.remove();
    const wrap = document.createElement('div');
    wrap.className = 'entry';
    const en = document.createElement('div');
    en.className = 'en';
    en.textContent = enText;
    const ja = document.createElement('div');
    ja.className = 'ja pending';
    ja.textContent = '翻訳中…';
    wrap.appendChild(en);
    wrap.appendChild(ja);
    log.appendChild(wrap);
    log.scrollTop = log.scrollHeight;
    return ja;
  }
  clearBtn.addEventListener('click', () => {
    log.innerHTML = '';
    const div = document.createElement('div');
    div.className = 'empty';
    div.id = 'emptyState';
    div.innerHTML = '<div class="stamp">翻訳</div>会話をクリアしました。続けて話しかけてください。';
    log.appendChild(div);
  });

  // ---------- translation (free, no API key) ----------
  // Uses Google Translate's public web endpoint (the same one translate.google.com's
  // page itself calls). It's unofficial and undocumented, so it can occasionally
  // rate-limit or change without notice, but it needs no account or key.
  async function translate(text){
    const url = 'https://translate.googleapis.com/translate_a/single'
      + '?client=gtx&sl=en&tl=ja&dt=t&q=' + encodeURIComponent(text);
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status + '(しばらくしてから再試行してください)');
    const data = await res.json();
    const chunks = (data && data[0]) ? data[0] : [];
    return chunks.map(seg => seg[0]).join('').trim();
  }

  async function runQueue(){
    if (queueRunning) return;
    queueRunning = true;
    while (translateQueue.length){
      const { text, node } = translateQueue.shift();
      setStatus(userWantsListening ? 'listening' : 'busy');
      try {
        const ja = await translate(text);
        node.textContent = ja || '(翻訳結果なし)';
        node.classList.remove('pending');
      } catch (err){
        node.textContent = '翻訳エラー: ' + err.message;
        node.classList.remove('pending');
        node.classList.add('failed');
      }
      log.scrollTop = log.scrollHeight;
    }
    queueRunning = false;
    setStatus(userWantsListening ? 'listening' : 'idle');
  }

  function enqueue(text, node){
    translateQueue.push({ text, node });
    runQueue();
  }

  // ---------- speech recognition ----------
  let recognition = new SR();
  recognition.lang = 'en-US';
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    recognitionActive = true;
    consecutiveErrors = 0;
    setStatus('listening');
    micBtn.classList.add('listening');
    micLabel.textContent = '停止';
    caption.classList.add('on');
  };

  recognition.onresult = (event) => {
    let interim = '', final = '';
    for (let i = event.resultIndex; i < event.results.length; i++){
      const r = event.results[i];
      if (r.isFinal) final += r[0].transcript;
      else interim += r[0].transcript;
    }
    if (interim) caption.textContent = interim;
    if (final.trim()){
      caption.textContent = '';
      const node = addEntry(final.trim());
      enqueue(final.trim(), node);
    }
  };

  recognition.onerror = (event) => {
    consecutiveErrors++;
    if (event.error === 'not-allowed' || event.error === 'service-not-allowed'){
      userWantsListening = false;
      setStatus('error');
      statusText.textContent = 'マイク許可が必要';
      caption.textContent = 'iPhoneの「設定 > Safari > マイク」を確認してください';
    } else if (event.error === 'no-speech' || event.error === 'aborted'){
      // silence timeout — will auto-restart via onend, not a real error
    } else {
      setStatus('error');
      statusText.textContent = 'エラー: ' + event.error;
    }
  };

  recognition.onend = () => {
    recognitionActive = false;
    micBtn.classList.remove('listening');
    caption.classList.remove('on');
    if (userWantsListening && consecutiveErrors < 8){
      micLabel.textContent = '停止';
      clearTimeout(restartTimer);
      restartTimer = setTimeout(() => {
        try { recognition.start(); } catch(e){ /* already starting */ }
      }, 300);
    } else {
      micLabel.textContent = '開始';
      if (userWantsListening) setStatus('error');
      else setStatus('idle');
      userWantsListening = false;
      caption.textContent = '';
    }
  };

  micBtn.addEventListener('click', () => {
    if (userWantsListening){
      userWantsListening = false;
      clearTimeout(restartTimer);
      try { recognition.stop(); } catch(e){}
    } else {
      userWantsListening = true;
      consecutiveErrors = 0;
      try { recognition.start(); } catch(e){ /* ignore InvalidStateError on double start */ }
    }
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && recognitionActive){
      try { recognition.stop(); } catch(e){}
    }
  });
})();
</script>
</body>
</html>
