<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>オープンデータ就職・企業情報検索</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 600px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 1.3rem;
      text-align: center;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #38bdf8, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      text-align: center;
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 16px;
    }
    .mode-switch {
      display: flex;
      background: #0f172a;
      padding: 4px;
      border-radius: 10px;
      margin-bottom: 16px;
    }
    .mode-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-weight: bold;
      font-size: 0.85rem;
      border-radius: 8px;
      cursor: pointer;
    }
    .mode-btn.active {
      background: #3b82f6;
      color: #ffffff;
    }
    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
    }
    .search-btn {
      padding: 12px 18px;
      background: #8b5cf6;
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .card-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: #38bdf8;
      margin-bottom: 6px;
    }
    .card-snippet {
      font-size: 0.85rem;
      color: #cbd5e1;
      line-height: 1.5;
    }
    .status-msg {
      text-align: center;
      color: #94a3b8;
      padding: 20px 0;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Open Data Search</h1>
    <div class="subtitle">APIキー不要・オープンデータ直接検索</div>

    <!-- モード切り替え -->
    <div class="mode-switch">
      <button id="btnUni" class="mode-btn active" onclick="switchMode('uni')">🎓 大学から検索</button>
      <button id="btnComp" class="mode-btn" onclick="switchMode('comp')">🏢 企業から検索</button>
    </div>

    <!-- 検索バー -->
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="大学名を入力 (例: 東京大学)" onkeydown="if(event.key==='Enter') executeOpenDataSearch()">
      <button class="search-btn" onclick="executeOpenDataSearch()">検索</button>
    </div>

    <!-- 検索結果エリア -->
    <div id="resultsList">
      <div class="status-msg">キーワードを入力して「検索」を押してください</div>
    </div>
  </div>

  <script>
    let currentMode = 'uni';

    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('btnUni').classList.toggle('active', mode === 'uni');
      document.getElementById('btnComp').classList.toggle('active', mode === 'comp');
      document.getElementById('searchInput').placeholder = mode === 'uni' ? '大学名を入力 (例: 東京大学)' : '企業名を入力 (例: ソニー)';
    }

    async function executeOpenDataSearch() {
      const keyword = document.getElementById('searchInput').value.trim();
      const resultsContainer = document.getElementById('resultsList');

      if (!keyword) {
        alert('検索キーワードを入力してください。');
        return;
      }

      resultsContainer.innerHTML = '<div class="status-msg">🔍 公開オープンデータ（Wikipedia API）から直接取得中...</div>';

      // 検索クエリの構築（大学名なら「就職 企業」、企業名なら「出身大学 採用」等の関連
